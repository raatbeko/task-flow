version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:9.2.3
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"
      - "9300:9300"

    volumes:
      - elastic-data:/usr/share/elasticsearch/data

volumes:
  elastic-data: